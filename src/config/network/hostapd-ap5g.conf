interface=${IFACE_AP5G}
ssid=${SPOT_NAME}
hw_mode=a
channel=36
# Canal 36 (5150-5250 MHz, UNII-1) : pas de DFS requis en France — pas d'attente
# de détection radar au démarrage, contrairement aux canaux 52+ (5250-5350/5470+).
ieee80211n=1
wmm_enabled=1
# Même réseau ouvert que l'AP 2,4GHz — lighttpd gère le portail captif
auth_algs=1
max_num_sta=30
